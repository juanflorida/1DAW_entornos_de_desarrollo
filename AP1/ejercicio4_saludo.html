<script>
// ============================================================
// EJERCICIO 4: Saludo
// Objetivo: saludar según la hora del día y el nombre.
//
// REGISTRO DE ERRORES (AP1):
// 1. Llamada a la función (`crearSaludo(hora, nombre)`): Tipo LÓGICA
//    - Descripción: Se pasaban los argumentos al revés de lo que espera la función (`nombre` primero y `hora` después), provocando que se mezclaran los tipos de datos.
//    - Corrección: Se cambió a `crearSaludo(nombre, hora)` para respetar el orden.
// ============================================================

function crearSaludo(nombre, hora) {
  let saludo = "Hola";
 
  if (hora < 12) {
    saludo = "Buenos días";
  } else if (hora < 20) {
    saludo = "Buenas tardes";
  } else {
    saludo = "Buenas noches";
  }
 
  return saludo + ", " + nombre + "!";
}
 
let nombre = "Ana";
let hora = 15;
let mensaje = crearSaludo(nombre, hora);
console.log(mensaje);
</script>
