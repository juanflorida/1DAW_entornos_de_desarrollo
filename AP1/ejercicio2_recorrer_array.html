<body>
  <h1>AP1 - Ejercicio 2: Recorrer array</h1>
  <p>Abre la consola del navegador (F12 &rarr; pestaña <strong>Consola</strong>) y recarga la página (F5) para ver el resultado.</p>
  <p>Para depurar, usa la pestaña <strong>Depurador / Sources</strong>.</p>

<script>
// ============================================================
// EJERCICIO 2: Recorrer un array
// Objetivo: calcular suma, máximo y media de una lista de números.
//
// RESULTADO ESPERADO:
//   Suma: 15
//   Máximo: 9
//   Media: 3
//   Máximo con negativos: -2
//
// REGISTRO DE ERRORES (AP1):
// 1. Línea ~32 (`sumar` - Inicialización de variable): Tipo LÓGICA
//    - Descripción: La variable `total` se inicializaba como una cadena vacía `""`, lo que provocaba que no apareciera una suma numérica.
//    - Corrección: Se cambió a `let total = 0;`.
// 2. Línea ~33 (`sumar` - Bucle for): Tipo LÓGICA
//    - Descripción: El bucle empezaba en `i = 1` (saltándose el primer elemento) y usaba `<=` (provocando un acceso a `undefined` al final).
//    - Corrección: Se cambió a `for (let i = 0; i < array.length; i++)`.
// 3. Línea ~41 (`maximo` - Inicialización): Tipo LÓGICA
//    - Descripción: `max` se inicializaba a `0`, lo cual fallaba al buscar el máximo en arrays de números puramente negativos (devolviendo `0` en vez del número mayor).
//    - Corrección: Se inicializó con el primer elemento del array: `let max = array[0];`.
// 4. Línea ~54 (`media` - Propiedad length): Tipo EJECUCIÓN
//    - Descripción: Se intentaba usar `array.length()` como si fuera una función, lo que lanzaba un error de tipo (TypeError).
//    - Corrección: Se eliminaron los paréntesis para usarlo correctamente como propiedad: `array.length`.
// ============================================================

function sumar(array) {
  let total = 0;
  for (let i = 0; i < array.length; i++) {
    total += array[i];
  }
  return total;
}

function maximo(array) {
  let max = array[0];
  for (let i = 0; i < array.length; i++) {
    if (array[i] > max) {
      max = array[i];
    }
  }
  return max;
}

function media(array) {
  return sumar(array) / array.length;
}

let numeros = [4, -2, 9, 1, 3];

console.log("Suma:", sumar(numeros));
console.log("Máximo:", maximo(numeros));
console.log("Media:", media(numeros));
console.log("Máximo con negativos:", maximo([-5, -2, -9]));
</script>
</body>
